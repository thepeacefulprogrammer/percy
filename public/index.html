<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#081008">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PERCY">
    <title>PERCY</title>
    <link rel="manifest" href="/manifest.webmanifest?v=3">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css?v=4">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>PERCY</h1>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <section id="statusBar" class="status-bar">Connecting…</section>

      <form id="chatForm" class="composer">
        <textarea id="messageInput" rows="3" placeholder="Type a message…"></textarea>
        <input id="attachmentInput" type="file" multiple accept="image/*,.txt,.md,.markdown,.json,.js,.cjs,.mjs,.ts,.tsx,.jsx,.css,.html,.xml,.yml,.yaml,.csv,.py,.sh,.java,.kt,.go,.rs,.rb,.php,.sql,.pdf,.docx,.doc,.pptx,.ppt,.xlsx,.xls,.odt,.ods,.odp,.rtf,.epub" hidden>
        <div id="attachmentList" class="attachment-list" aria-live="polite"></div>
        <div class="composer-actions">
          <div class="composer-actions-left">
            <button id="attachBtn" class="secondary icon-button" type="button" aria-label="Attach files" title="Attach files">📎</button>
            <button id="composerAbortBtn" class="secondary icon-button" type="button" aria-label="Stop response" title="Stop response">■</button>
            <button id="composerNewSessionBtn" class="secondary icon-button" type="button" aria-label="Start new chat" title="Start new chat">✚</button>
            <button id="themeToggleBtn" class="secondary icon-button" type="button" aria-label="Switch theme" title="Switch theme">☼</button>
          </div>
        </div>
      </form>
    </main>

    <script type="module" src="/app.js?v=9"></script>
  </body>
</html>
